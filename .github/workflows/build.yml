name: Build Qt

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggers

jobs:
  linux-qt:
    runs-on: ubuntu-latest
    
    steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        
    - name: Install aqtinstall
      run: pip install aqtinstall==3.3.0
  
    - name: Install Qt 6.6.1
      run: |
        aqt install-qt linux desktop 6.6.1 gcc_64 -O $GITHUB_WORKSPACE/Qt
        echo ""
        ls -la $GITHUB_WORKSPACE/Qt/6.6.1
        echo ""
        echo "$GITHUB_WORKSPACE/Qt/6.6.1/gcc_64/bin" >> $GITHUB_PATH
        echo "Qt6_DIR=$GITHUB_WORKSPACE/Qt/6.6.1/gcc_64" >> $GITHUB_ENV
    
    - name: Verify Qt installation
      run: |
        echo "=== Qt Installation Location ==="
        echo "Qt6_DIR: $Qt6_DIR"
        echo ""
        echo "=== Qt Directory Contents ==="
        ls -la $Qt6_DIR
        echo ""
        echo "=== Qt bin Directory ==="
        ls -la $Qt6_DIR/bin
        echo ""
        echo "=== Qt CMake Files ==="
        find $Qt6_DIR -name "Qt6Config.cmake" 2>/dev/null || echo "Qt6Config.cmake not found"
        echo ""
        echo "=== Qt Environment Variables ==="
        env | grep -i qt || echo "No Qt variables set"
        
  windows-qt:
    runs-on: windows-latest
    
    steps:
    - name: Install Qt
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: '6.6.1'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'

    - name: Verify Qt installation
      shell: pwsh
      run: |
        echo "=== Qt Installation Root ==="
        echo "$env:Qt6_DIR"
        echo ""
        echo "=== qmake path ==="
        Get-Command qmake | Format-List
